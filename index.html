<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип кабинета партнёра</title>
<style>
/* Макет: слева — пояснения к экрану и переключатель «Телефон / Компьютер», справа — окно кабинета.
   Кабинет сам перестраивается под ширину своего окна (container queries): узко — мобильная раскладка,
   от 860 px — меню слева, таблицы, две колонки. На настоящем телефоне — кабинет во всю ширину.
   Оформление — дизайн-система Bitrix24 Air: цвета, шрифт, скругления и размеры взяты из токенов
   @bitrix24/b24ui-nuxt 2.15 (air-design-tokens), на нём будет собран настоящий кабинет. */
:root {
  --page: #DFE0E3;          /* фон вокруг макета, не часть кабинета */
  --app: #EEF2F4;           /* --air-theme-bg-color */
  --card: #FFFFFF;          /* --ui-color-bg-content-primary */
  --card-2: #F8FAFB;        /* --ui-color-gray-02 */
  --ink: #333333;           /* --ui-color-base-1 */
  --ink-2: #525C69;         /* --ui-color-base-2 */
  --muted: #828B95;         /* --ui-color-base-3 */
  --dim: #A8ADB4;           /* --ui-color-base-4 */
  --line: #EDEEF0;          /* --ui-color-base-7, обводка карточек */
  --line-2: #DFE0E3;        /* --ui-color-base-6, обводка полей */
  --accent: #0075FF;        /* --ui-color-accent-main-primary */
  --accent-hover: #1F86FF;  /* --ui-color-accent-main-primary-alt */
  --accent-weak: #E6F4FF;   /* --ui-color-accent-soft-blue-2 */
  --sel: #EDF7FF;           /* --ui-color-design-selection-bg */
  --link: #0154C8;          /* --ui-color-accent-main-link */
  --on-accent: #FFFFFF;
  --ok: #24B547;            /* --ui-color-accent-extra-grass */
  --ok-weak: #CAFFE7;       /* --ui-color-accent-soft-green-2 */
  --ok-line: #A7FAD3;       /* --ui-color-accent-soft-green-1 */
  --warn: #E88C02;          /* --ui-color-accent-extra-orange */
  --warn-weak: #FFF4D6;     /* --ui-color-accent-soft-orange-2 */
  --warn-line: #FFEBA6;     /* --ui-color-accent-soft-orange-1 */
  --bad: #FF5752;           /* --ui-color-accent-main-alert */
  --bad-weak: #FFE8E8;      /* --ui-color-accent-soft-red-2 */
  --bad-line: #FFCDCC;      /* --ui-color-accent-soft-red-1 */
  --info: #0154C8;
  --info-weak: #E6F4FF;
  --na: #828B95;            /* --ui-color-design-tinted-na-content */
  --na-weak: #EDEEF0;       /* --ui-color-design-tinted-na-bg */
  --frame: #333333;
  --shadow: 0 30px 60px -32px rgba(0, 0, 0, .35);
  --shadow-s: 0 2px 4px 0 rgba(0, 0, 0, .08); /* --ui-shadow-bottom-s */
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 12px; --r-xl: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000000; --app: #171717; --card: #262626; --card-2: #1F1F1F;
    --ink: #F8F8F8; --ink-2: #CACBCC; --muted: #A7A9AB; --dim: #828385; --line: #373838; --line-2: #555657;
    --accent: #1587FA; --accent-hover: #2A94FF; --accent-weak: #062040; --sel: #1F3048; --link: #468BEC; --on-accent: #FFFFFF;
    --ok: #22AC43; --ok-weak: #052717; --ok-line: #0A4C2E; --warn: #E0911D; --warn-weak: #302000; --warn-line: #5E3F00;
    --bad: #F2473D; --bad-weak: #300E0C; --bad-line: #5E1C18; --info: #468BEC; --info-weak: #062040;
    --na: #A7A9AB; --na-weak: #373838; --frame: #373838;
    --shadow: 0 30px 60px -32px rgba(0, 0, 0, .8); --shadow-s: 0 2px 4px 0 rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #000000; --app: #171717; --card: #262626; --card-2: #1F1F1F;
  --ink: #F8F8F8; --ink-2: #CACBCC; --muted: #A7A9AB; --dim: #828385; --line: #373838; --line-2: #555657;
  --accent: #1587FA; --accent-hover: #2A94FF; --accent-weak: #062040; --sel: #1F3048; --link: #468BEC; --on-accent: #FFFFFF;
  --ok: #22AC43; --ok-weak: #052717; --ok-line: #0A4C2E; --warn: #E0911D; --warn-weak: #302000; --warn-line: #5E3F00;
  --bad: #F2473D; --bad-weak: #300E0C; --bad-line: #5E1C18; --info: #468BEC; --info-weak: #062040;
  --na: #A7A9AB; --na-weak: #373838; --frame: #373838;
  --shadow: 0 30px 60px -32px rgba(0, 0, 0, .8); --shadow-s: 0 2px 4px 0 rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
a { color: var(--link); text-decoration: none; }
a:not([class]):hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Сцена ---------- */
.stage {
  display: grid;
  grid-template-columns: minmax(260px, 340px) auto;
  gap: 48px;
  justify-content: center;
  align-items: start;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage[data-mode="desktop"] { grid-template-columns: 220px minmax(0, 1fr); gap: 24px; justify-content: stretch; }
.notes { position: sticky; top: 32px; display: flex; flex-direction: column; gap: 20px; padding-top: 24px; }
.stage[data-mode="desktop"] .notes { padding-top: 8px; gap: 16px; }
.notes-head { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.notes h1 { margin: 0; font-weight: 600; font-size: 22px; line-height: 1.25; text-wrap: balance; }
.stage[data-mode="desktop"] .notes h1 { font-size: 18px; }
.notes p { margin: 0; color: var(--ink-2); }
.stage[data-mode="desktop"] .notes p { font-size: 13px; }
.mode, .theme-sw { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); }
.mode button, .theme-sw button { border: 0; background: none; padding: 7px 6px; border-radius: var(--r-sm); font-weight: 500; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.mode button[aria-pressed="true"], .theme-sw button[aria-pressed="true"] { background: var(--sel); color: var(--accent); }
.notes details { border-top: 1px solid var(--line-2); padding-top: 16px; }
.notes summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.notes summary::-webkit-details-marker { display: none; }
.notes summary .chev { transition: transform .2s; color: var(--muted); }
.notes details[open] summary .chev { transform: rotate(180deg); }
.screen-list { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.screen-list a { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink-2); font-size: 14px; }
.screen-list a span:last-child { color: var(--muted); font-size: 12px; }
.screen-list a:hover { background: var(--card); color: var(--ink); }
.screen-list a[aria-current="page"] { background: var(--sel); color: var(--accent); font-weight: 500; }
.note-box { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.note-box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }
.stage[data-mode="desktop"] .note-box ul { font-size: 13px; }
.note-tag { display: inline-block; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line-2); padding-top: 10px; }

/* ---------- Окно кабинета ---------- */
.device {
  width: 390px;
  height: min(844px, calc(100vh - 64px));
  min-height: 640px;
  border: 10px solid var(--frame);
  border-radius: 46px;
  overflow: hidden;
  background: var(--app);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.stage[data-mode="desktop"] .device {
  width: 100%;
  max-width: 1320px;
  height: calc(100vh - 64px);
  min-height: 600px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
}
.browserbar { display: none; align-items: center; gap: 12px; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line); flex: none; }
.stage[data-mode="desktop"] .browserbar { display: flex; }
.browserbar .dots { display: flex; gap: 6px; }
.browserbar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
.browserbar .addr { flex: 1; max-width: 420px; margin-inline: auto; text-align: center; font-size: 12px; color: var(--muted); background: var(--app); border-radius: var(--r-sm); padding: 4px 10px; }
.shell { flex: 1; min-height: 0; container: app / inline-size; }
.app { height: 100%; display: flex; flex-direction: column; position: relative; background: var(--app); }
.app-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); min-height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.brand svg { flex: none; }
.head-title { font-weight: 600; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.updated { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--card); cursor: pointer; flex: none; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-2); color: var(--ink); }
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--card); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; text-decoration: none; color: var(--muted); font-size: 11px; border-radius: var(--r-md); }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabbar a.plus span.circle { display: grid; place-items: center; width: 42px; height: 42px; margin-top: -16px; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 14px -8px var(--accent); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 84px; background: var(--ink); color: var(--card); padding: 12px 14px; border-radius: var(--r-lg); font-size: 14px; z-index: 20; box-shadow: var(--shadow-s); }

/* ---------- Общие элементы ---------- */
h2.screen-h { margin: 0; font-weight: 600; font-size: 20px; line-height: 1.25; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; }
.card-h { margin: 0 0 10px; font-size: 15px; color: var(--ink); font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-sm { display: flex; flex-direction: column; gap: 4px; }
/* Кнопки: размер xl (46 px) на телефоне, lg (38 px) на компьютере; скругление 10 px, как у B24Button */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 23px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--card); color: var(--ink-2); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--line-2); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.block { width: 100%; }
.btn.small { min-height: 34px; padding: 0 13px; font-size: 14px; font-weight: 500; }
.link-btn { background: none; border: 0; padding: 0; color: var(--link); font-weight: 500; cursor: pointer; }
/* Метки статусов — как B24Badge в «тонированном» варианте: мягкий фон, цветной текст, форма «пилюля» */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99rem; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--accent-weak); color: var(--link); }
.pill.info { background: var(--info-weak); color: var(--info); }
.pill.ok { background: var(--ok-weak); color: var(--ok); }
.pill.warn { background: var(--warn-weak); color: var(--warn); }
.pill.bad { background: var(--bad-weak); color: var(--bad); }
.pill.neutral { background: var(--na-weak); color: var(--na); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
/* Плашки — как B24Alert */
.banner { border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.banner.warn { background: var(--warn-weak); color: var(--ink); border: 1px solid var(--warn-line); }
.banner.ok { background: var(--ok-weak); color: var(--ink); border: 1px solid var(--ok-line); }
.banner.bad { background: var(--bad-weak); color: var(--ink); border: 1px solid var(--bad-line); }
.banner strong { font-weight: 600; }
/* Колонки: на узком окне .col «растворяется», порядок задаёт order; на широком — сетка */
.cols { display: flex; flex-direction: column; gap: 14px; }
.col { display: contents; }
.only-wide { display: none !important; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 500; padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr[data-href] { cursor: pointer; }
.tbl tbody tr[data-href]:hover td { background: var(--sel); }
.tbl .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl .nw { white-space: nowrap; }
.tbl a { font-weight: 500; text-decoration: none; color: var(--link); }

/* ---------- Вход ---------- */
.login { justify-content: center; gap: 22px; min-height: 100%; width: 100%; max-width: 400px; margin-inline: auto; }
.login-mark { display: flex; flex-direction: column; gap: 14px; }
.login h2 { margin: 0; font-weight: 600; font-size: 22px; line-height: 1.2; }
.code-input { letter-spacing: .5em; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.legal-item { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1.5px solid var(--line); border-radius: var(--r-lg); background: var(--card); }
.legal-d summary { cursor: pointer; list-style: none; color: var(--link); font-size: 13px; font-weight: 500; }
.legal-d summary::-webkit-details-marker { display: none; }
.legal { margin-top: 8px; max-height: 220px; overflow: auto; font-size: 13px; line-height: 1.5; color: var(--ink-2); background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; white-space: pre-line; }

/* ---------- Формы (как B24FormField + B24Input) ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.req { color: var(--bad); }
.input, select.input, textarea.input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--card); color: var(--ink); }
.input::placeholder { color: var(--dim); }
.input:hover { border-color: var(--dim); }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: 0; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.input.invalid { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
.method { display: flex; flex-direction: column; gap: 8px; }
.method label { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 12px; border: 1.5px solid var(--line); border-radius: var(--r-lg); background: var(--card); cursor: pointer; font-size: 14px; font-weight: 400; color: var(--ink); }
.method label:hover { border-color: var(--line-2); }
.method input { margin: 2px 0 0; accent-color: var(--accent); width: 18px; height: 18px; }
.method strong { display: block; font-weight: 600; }
.method small { color: var(--muted); font-size: 13px; }
.method label:has(input:checked) { border-color: var(--accent); background: var(--sel); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); }

/* ---------- Главная ---------- */
.hello { display: flex; flex-direction: column; gap: 4px; }
.manager { display: flex; align-items: center; gap: 12px; }
.avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-weak); color: var(--link); font-weight: 600; }
.manager .who { min-width: 0; flex: 1; }
.manager .who div:first-child { font-weight: 600; }
.manager .phone { color: var(--ink-2); font-size: 13px; user-select: all; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k-label { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .02em; }
.kpi .k-value { font-weight: 600; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi .k-note { font-size: 12px; color: var(--muted); }
.kpi .k-note.up { color: var(--ok); }
.funnel { display: flex; flex-direction: column; gap: 8px; }
.f-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; }
.f-row .f-name { color: var(--ink-2); }
.f-row .f-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.f-row .f-bar { grid-column: 1 / -1; height: 6px; border-radius: 99rem; background: var(--na-weak); overflow: hidden; }
.f-row .f-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99rem; }
.f-row.zero .f-name, .f-row.zero .f-val { color: var(--muted); }
.f-row.lost .f-bar i { background: var(--bad); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14px; }
.li:first-child { padding-top: 0; }
.li:last-child { padding-bottom: 0; }
.li .when { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ---------- Клиенты ---------- */
.filters { display: flex; flex-direction: column; gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 38px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 99rem; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.chip:hover { border-color: var(--line-2); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--accent); border-color: var(--accent); }
.chip .cnt { color: var(--muted); font-weight: 400; margin-left: 4px; }
.chip[aria-pressed="true"] .cnt { color: inherit; opacity: .75; }
.client { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); text-decoration: none; color: var(--ink); }
.client:hover { border-color: var(--line-2); box-shadow: var(--shadow-s); }
.client .c-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

  function viewHome() {
    var active = clients.filter(function (c) { return c.stage <= 8; });
    var growth = clients.filter(function (c) { return c.passed >= '2026-10-01'; }).length;
    var inWork = clients.filter(function (c) { return c.stage <= 8 && c.contract; });
    var inWorkSum = inWork.reduce(function (s, c) { return s + c.contract; }, 0);
    var counts = [], sums = [], max = 1;
    for (var i = 1; i <= 10; i++) {
      var st = clients.filter(function (c) { return c.stage === i; });
      counts[i] = st.length;
      sums[i] = st.reduce(function (s, c) { return s + (c.contract || 0); }, 0);
      if (counts[i] > max) max = counts[i];
    }
    var funnel = '';
    for (var j = 1; j <= 10; j++) {
      funnel += '<div class="f-row' + (counts[j] ? '' : ' zero') + (j === 10 ? ' lost' : '') + '">' +

    var feed = [

      ['2026-10-14', 'Лебедева Е. О. — участок забронирован'],
      ['2026-10-12', 'Новиков А. П. — сделка закрыта, начислено 59 000 ₽'],
      ['2026-10-10', 'Соколов Д. А. — оплачен задаток, начисление после договора'],
      ['2026-10-05', 'Иванов С. П. — оплачен счёт, начислено 12 000 ₽']
    ];
    // на компьютере «Передать клиента» — только в меню слева: основная кнопка на экране одна (правило кита)
    return reqBanner() +
      '<div class="cols c-3-2">' +
        '<div class="col"><div class="hello"><h2 class="screen-h">Добрый день, ' + PARTNER.first + '</h2><span class="sub">Сегодня ' + dWords(TODAY) + '</span></div>' +
          '<a class="btn primary block cta only-narrow" href="#transfer">' + I.plus + 'Передать клиента</a></div>' +
        '<div class="col">' + managerCard(PM) + '</div>' +
      '</div>' +
      '<div class="kpis">' +
        kpi('Активные клиенты', active.length, '+' + growth + ' за октябрь', true) +
        kpi('Сделки в работе', inWork.length, 'на ' + mln(inWorkSum)) +
        kpi('Начислено в октябре', rub(71000), 'в сентябре — ' + rub(12000), true) +
        kpi('К выплате', rub(12000), 'выплата 15 ноября') +
      '</div>' +
      '<div class="cols c-3-2">' +
        '<div class="col"><section class="card"><h3 class="card-h">Клиенты по этапам</h3><div class="funnel">' + funnel + '</div></section></div>' +
        '<div class="col"><section class="card"><h3 class="card-h">Последние выплаты</h3><div class="list">' +
            '<div class="li"><span>Выплата за сентябрь и бонус</span><span class="num"><b>' + rub(17000) + '</b> <span class="when">15.10</span></span></div>' +
            '<div class="li"><span>Выплата за август</span><span class="num"><b>' + rub(37000) + '</b> <span class="when">15.09</span></span></div>' +
          '</div><div style="margin-top:10px"><a href="#money">Все начисления и выплаты</a></div></section>' +

          '</div></section></div>' +
      '</div>';
  }

  function matchFilter(c, f) {
    if (f === 'work') return c.stage <= 8;
    if (f === 'won') return c.stage === 9;
    if (f === 'lost') return c.stage === 10;
    if (f === 'stall') return stalled(c);
    return true;
  }
  function filteredClients() {
    var q = S.search.trim().toLowerCase(), qd = digits(q);
    return clients.filter(function (c) {
      if (!matchFilter(c, S.filter)) return false;
      if (S.village && c.village !== S.village) return false;
      if (S.period === 'month' && c.passed < '2026-10-01') return false;
      if (S.period === '3m' && c.passed < '2026-07-19') return false;
      if (q) {
        var byName = c.name.toLowerCase().indexOf(q) !== -1;
        var byPhone = qd.length >= 3 && digits(c.phone).indexOf(qd) !== -1;
        if (!byName && !byPhone) return false;
      }
      return true;
    }).sort(function (a, b) { return a.changed < b.changed ? 1 : -1; });
  }
  function viewClients() {
    var chips = [['all', 'Все'], ['work', 'В работе'], ['won', 'Успешно'], ['lost', 'Не состоялись'], ['stall', 'Зависшие']];
    var vOpts = '<option value="">Все посёлки</option>' + VILLAGES.map(function (v) {
      return '<option' + (S.village === v.name ? ' selected' : '') + '>' + esc(v.name) + '</option>';
    }).join('');
    return '<div class="row between"><h2 class="screen-h">Мои клиенты</h2>' +
        '<button class="btn small" type="button" data-action="excel">' + I.excel + 'Excel</button></div>' +
      '<div class="filters">' +
        '<div class="search">' + I.search + '<input class="input" id="q" type="search" placeholder="Имя или телефон" value="' + esc(S.search) + '" aria-label="Поиск по имени и телефону"></div>' +
        '<div class="chips" role="group" aria-label="Фильтр по состоянию">' + chips.map(function (ch) {
          var n = clients.filter(function (c) { return matchFilter(c, ch[0]); }).length;
          return '<button class="chip" type="button" data-filter="' + ch[0] + '" aria-pressed="' + (S.filter === ch[0]) + '">' + ch[1] + '<span class="cnt">' + n + '</span></button>';
        }).join('') + '</div>' +
        '<div class="two">' +
          '<select class="input" id="period" aria-label="Период передачи">' +
            '<option value="all"' + (S.period === 'all' ? ' selected' : '') + '>За всё время</option>' +
            '<option value="month"' + (S.period === 'month' ? ' selected' : '') + '>Переданы в октябре</option>' +
            '<option value="3m"' + (S.period === '3m' ? ' selected' : '') + '>За 3 месяца</option>' +
          '</select>' +
          '<select class="input" id="village" aria-label="Посёлок">' + vOpts + '</select>' +
        '</div>' +
      '</div>' +
      '<div id="clientList">' + clientListHTML() + '</div>';

  function moneyCell(c) {
    var r = reward(c);
    if (!r) return '<span class="sub">—</span>';
    return '<div class="stack-sm" style="align-items:flex-end">' + (r.sum != null ? '<b class="num">' + (r.status === 'forecast' ? '≈ ' : '') + rub(r.sum) + '</b>' : '') + pill(r.status) + '</div>';
  }
  function clientListHTML() {
    var list = filteredClients();
    if (!list.length) return '<div class="empty">Клиентов с такими условиями нет.<br><button class="link-btn" type="button" data-action="reset">Сбросить фильтры</button></div>';
    var cards = list.map(function (c) {
      var r = reward(c);
      var money = '';
      if (c.contract || r) {
        money = '<div class="c-money"><span>' + (c.contract ? 'Договор <b>' + rub(c.contract) + '</b>' : '') + '</span>' +
          (r ? '<span class="row">' + (r.sum != null ? '<b>' + (r.status === 'forecast' ? '≈ ' : '') + rub(r.sum) + '</b>' : '') + pill(r.status) + '</span>' : '') + '</div>';
      }

        '<div class="c-top"><span class="c-name">' + esc(c.name) + '</span>' + stagePill(c) + '</div>' +

    return '<div class="stack only-narrow">' + cards + '</div>' +

  }

  function viewClient(id) {
    var c = byId(id);
    if (!c) return '<div class="empty">Клиент не найден. <a href="#clients">К списку</a></div>';
    var reached = {};
    c.path.forEach(function (p) { reached[p[0]] = p[1]; });
    var cur = c.path[c.path.length - 1][0];
    var shown = c.path.map(function (p) { return p[0]; });
    if (cur !== 10 && cur !== 9) {
      for (var s = cur + 1; s <= 9; s++) { if (s === 2 && c.method !== 'self') continue; shown.push(s); }
    }
    var steps = shown.map(function (s) {
      var cls = s === 10 ? 'lost' : s === cur ? (cur === 9 ? 'done' : 'current') : reached[s] ? 'done' : '';
      var mark = cls === 'done' ? I.check : cls === 'lost' ? I.cross : '';
      return '<li class="step ' + cls + '"><span class="mark">' + mark + '</span><span class="s-name">' + STAGES[s] + '</span><span class="s-date">' + (reached[s] ? dShort(reached[s]) : '') + '</span></li>';
    }).join('');

    var money = '';
    if (c.notAccrued) {
      money = c.fromBase
        ? '<div class="banner warn"><strong>Клиент из базы</strong><span>' + esc(c.notAccrued) + '</span></div>' +
          '<div class="sub">Считаете, что это ошибка? Позвоните менеджеру по партнёрам — он проверит и может вернуть ставку.</div>'
        : '<div class="banner bad"><strong>Вознаграждение не начислено</strong><span>' + esc(c.notAccrued) + '</span></div>';
    } else if (c.accruals && c.accruals.length) {
      var total = 0;
      var rows = c.accruals.map(function (a) {
        var sum = a.base * c.rate / 100; total += sum;
        return '<div class="acc"><span class="a-date">' + (a.deposit ? 'Задаток ' : 'Счёт оплачен ') + dFull(a.date) + '</span>' +
          '<span class="a-formula">' + pct(c.rate) + ' от ' + rub(a.base) + ' = <b>' + rub(sum) + '</b></span>' +
          '<span class="a-side">' + pill(a.status) + '<span class="a-pay">' + payText(a) + '</span></span></div>';
      }).join('');
      var left = c.contract - c.paid;
      var waits = c.accruals.some(function (a) { return a.status === 'wait'; });
      money = moneyHead(c) + '<div>' + rows + '</div>' +
        (waits ? '<div class="sub">С задатка вознаграждение начисляется, когда подписан договор. Если бронь сорвётся, с задатка не начисляется.</div>' : '') +
        (left > 0 ? '<div class="row between" style="font-size:14px"><span>Ожидается после следующих оплат</span><span class="row"><b class="num">≈ ' + rub(left * c.rate / 100) + '</b>' + pill('forecast') + '</span></div>' : '') +
        '<div class="sub">Всего по сделке: ' + rub(total) + (left > 0 ? ' из ≈ ' + rub(c.contract * c.rate / 100) : '') + '. Ставка ' + pct(c.rate) + ' закреплена при первой оплате.</div>';
    } else if (c.contract) {
      money = moneyHead(c) +
        '<div class="row between"><span>Ожидаемое вознаграждение</span><span class="row"><b class="num">≈ ' + rub(c.contract * c.rate / 100) + '</b>' + pill('forecast') + '</span></div>' +
        '<div class="sub">Начисление появится после первой оплаты клиента.</div>';
    } else if (c.dup) {
      money = '<div class="banner warn"><strong>Отмечен как «клиент из базы»</strong><span>Ставка 0 % — клиент уже был в базе компании. Если это ошибка — позвоните менеджеру по партнёрам: он проверит и может вернуть ставку.</span></div>';
    } else {
      money = '<div class="sub">Вознаграждение появится, когда будут известны участок и цена.</div>';
    }

    var plotRows = '<dt>Посёлок</dt><dd>' + esc(c.village) + '</dd>' +
      '<dt>Участок</dt><dd>' + (c.plot ? '№ ' + esc(c.plot) : 'не выбран') + '</dd>' +

        kpi('Ожидается', '≈ ' + rub(expected), 'после оплат клиентов') +

  function moneyAcc() {
    var rows = [];
    clients.forEach(function (c) {
      (c.accruals || []).forEach(function (a) { rows.push({ c: c, a: a }); });
    });
    rows.sort(function (x, y) { return x.a.date < y.a.date ? 1 : -1; });
    var forecast = forecastList();
    var cardRows = rows.map(function (r) {
      var sum = r.a.base * r.c.rate / 100;
      return '<div class="acc"><span class="a-date"><a href="#client/' + r.c.id + '">' + esc(short(r.c.name)) + '</a> · ' + accLabel(r.a) + '</span>' +
        '<span class="a-formula">' + pct(r.c.rate) + ' от ' + rub(r.a.base) + ' = <b>' + rub(sum) + '</b></span>' +
        '<span class="a-side">' + pill(r.a.status) + '<span class="a-pay">' + payText(r.a) + '</span></span></div>';
    }).join('');
    var tblRows = rows.map(function (r) {
      var sum = r.a.base * r.c.rate / 100;
      return '<tr data-href="#client/' + r.c.id + '"><td><a href="#client/' + r.c.id + '">' + esc(r.c.name) + '</a></td>' +
        '<td class="nw">' + dFull(r.a.date) + (r.a.deposit ? '<div class="sub">задаток</div>' : '') + '</td>' +
        '<td class="nw num">' + pct(r.c.rate) + ' от ' + rub(r.a.base) + '</td>' +
        '<td class="r"><b>' + rub(sum) + '</b></td>' +
        '<td>' + pill(r.a.status) + '</td>' +
        '<td class="nw sub">' + payText(r.a) + '</td></tr>';
    }).join('');
    return '<section class="stack"><h3 class="card-h" style="margin:0">По оплаченным счетам</h3>' +
        '<div class="card only-narrow">' + cardRows + '</div>' +
        '<div class="tbl-wrap only-wide"><table class="tbl"><thead><tr><th>Клиент</th><th>Оплаченный счёт</th><th>Расчёт</th><th class="r">Начислено</th><th>Статус</th><th>Выплата</th></tr></thead><tbody>' + tblRows + '</tbody></table></div>' +
      '</section>' +
      '<div class="cols">' +
        '<div class="col"><section class="card"><h3 class="card-h">Ожидается</h3>' + forecast.map(function (c) {
          var left = c.contract - (c.paid || 0);
          return '<div class="acc"><span class="a-date"><a href="#client/' + c.id + '">' + esc(short(c.name)) + '</a> · ' + STAGES[c.stage].toLowerCase() + '</span>' +
            '<span class="a-formula">' + pct(c.rate) + ' от ' + rub(left) + ' ≈ <b>' + rub(left * c.rate / 100) + '</b></span>' +
            '<span class="a-side">' + pill('forecast') + '</span></div>';
        }).join('') + '</section></div>' +
        '<div class="col"><section class="card"><h3 class="card-h">Не начислено</h3>' + clients.filter(function (c) { return c.notAccrued; }).map(function (c) {
          return '<div class="acc"><span class="a-date"><a href="#client/' + c.id + '">' + esc(short(c.name)) + '</a></span>' +
            '<span class="a-formula">' + esc(c.notAccrued) + '</span><span class="a-side">' + pill('none') + '</span></div>';
        }).join('') + '</section></div>' +
      '</div>';

          '<dt>E-mail</dt><dd>' + PARTNER.email + '</dd>' +
        '</dl></section></div>' +
        '<div class="col"><section class="card stack"><h3 class="card-h" style="margin:0">Реквизиты для выплат</h3>' + reqCard + '</section></div>' +
      '</div>';
  }

  function reqFields(form) {
    var f = [['name', form === 'org' ? 'Название организации' : form === 'ip' ? 'ФИО предпринимателя' : 'ФИО полностью', ''],
      ['inn', 'ИНН', form === 'org' ? '10 цифр' : '12 цифр']];
    if (form === 'ip') f.push(['ogrnip', 'ОГРНИП', '15 цифр']);
    if (form === 'org') f.push(['ogrn', 'ОГРН', '13 цифр'], ['kpp', 'КПП', '9 цифр']);
    f.push(['bik', 'БИК банка', '9 цифр'], ['acc', 'Расчётный счёт', '20 цифр']);
    return f;
  }
  function reqErrors(d) {
    var e = {};
    if (!d.name.trim()) e.name = 'Укажите получателя';
    if (!innOk(d.inn) || d.inn.length !== (d.form === 'org' ? 10 : 12)) e.inn = 'ИНН с ошибкой — проверьте цифры';
    if (d.form === 'ip' && d.ogrnip.length !== 15) e.ogrnip = 'ОГРНИП — 15 цифр';
    if (d.form === 'org' && d.ogrn.length !== 13) e.ogrn = 'ОГРН — 13 цифр';
    if (d.form === 'org' && d.kpp.length !== 9) e.kpp = 'КПП — 9 цифр';
    if (d.bik.length !== 9) e.bik = 'БИК — 9 цифр';
    else if (!accOk(d.acc, d.bik)) e.acc = 'Счёт не сходится с БИК — проверьте цифры';
    return e;
  }
  function viewRequisites() {
    var R = S.req, change = R.mode === 'change';
    var d = R.draft || { form: change && R.data ? R.data.form : 'ip', name: '', inn: '', ogrnip: '', ogrn: '', kpp: '', bik: '', acc: '' };
    R.draft = d;
    var opts = Object.keys(FORMS).map(function (k) { return '<option value="' + k + '"' + (d.form === k ? ' selected' : '') + '>' + FORMS[k] + '</option>'; }).join('');
    return '<div class="stack w-640" style="gap:14px">' +
      '<h2 class="screen-h">' + (change ? 'Новые реквизиты' : 'Реквизиты для выплат') + '</h2>' +
      '<div class="sub">' + (change ? 'Менеджер по партнёрам проверит заявку и применит новые реквизиты. До этого выплаты идут по прежним.'
        : 'Заполните один раз — без реквизитов выплаты не начнутся. Изменить потом можно только через заявку менеджеру по партнёрам.') + '</div>' +
      '<form class="stack" id="reqForm" novalidate>' +
        '<div class="field"><label for="rq-form">Форма работы</label><select class="input" id="rq-form">' + opts + '</select></div>' +
        reqFields(d.form).map(function (f) {
          var num = f[0] !== 'name';
          return '<div class="field"><label for="rq-' + f[0] + '">' + f[1] + ' <span class="req">*</span></label>' +
            '<input class="input' + (num ? ' num' : '') + '" id="rq-' + f[0] + '"' + (num ? ' inputmode="numeric"' : '') + ' value="' + esc(d[f[0]]) + '"' + (f[2] ? ' placeholder="' + f[2] + '"' : '') + '>' +
            (f[0] === 'bik' ? '<span class="hint" id="bankName">' + esc(BANKS[d.bik] || 'Банк определится по БИК') + '</span>' : '') +
            '<span class="err" id="re-' + f[0] + '" hidden></span></div>';
        }).join('') +
        '<div class="row" style="flex-wrap:wrap"><button class="btn primary" type="submit">Далее</button>' +
        '<button class="link-btn" type="button" data-action="req-sample">Заполнить примером (только в прототипе)</button></div>' +
      '</form></div>';
  }
  function viewRequisitesCheck() {
    var R = S.req, d = R.draft, change = R.mode === 'change';
    var rows = '<dt>Форма работы</dt><dd>' + FORMS[d.form] + '</dd>' +
      reqFields(d.form).map(function (f) {
        var v = f[0] === 'acc' ? accGroups(d.acc) : d[f[0]];
        return '<dt>' + f[1] + '</dt><dd class="num">' + esc(v) + '</dd>' + (f[0] === 'bik' ? '<dt>Банк</dt><dd>' + esc(BANKS[d.bik] || 'по справочнику БИК') + '</dd>' : '');
      }).join('');
    return '<div class="stack w-640" style="gap:14px">' +
      '<h2 class="screen-h">Проверьте реквизиты</h2>' +
      '<div class="sub">Ошибка в реквизитах — деньги уйдут не туда или вернутся. Сверьте каждую цифру.</div>' +
      '<section class="card"><dl class="kv">' + rows + '</dl></section>' +
      '<div class="banner warn"><span>' + (change ? 'Заявка уйдёт менеджеру по партнёрам: он сверит и применит новые реквизиты.'
        : 'После сохранения изменить реквизиты можно только через заявку менеджеру по партнёрам.') + '</span></div>' +
      '<form class="stack" id="reqCheck" novalidate>' +
        '<label class="check"><input type="checkbox" id="rqOk"><span>Данные верные <span class="req">*</span></span></label>' +
        '<span class="err" id="rqOkErr" hidden>Подтвердите, что данные верные</span>' +
        '<div class="row" style="flex-wrap:wrap"><button class="btn primary" type="submit">' + (change ? 'Отправить заявку' : 'Сохранить реквизиты') + '</button>' +
        '<a class="btn" href="#requisites' + (change ? '/change' : '') + '">Исправить</a></div>' +
      '</form></div>';
  }

  /* ===================== Каркас и маршруты ===================== */
  var elApp = document.getElementById('app');
  var elView = document.getElementById('view');
  var elHead = document.getElementById('head');
  var elTab = document.getElementById('tabbar');
  var elToast = document.getElementById('toast');
  var elStage = document.getElementById('stage');
  var narrowMQ = window.matchMedia('(max-width: 780px)');
  var toastTimer = null;

  function toast(msg) {
    elToast.textContent = msg;
    elToast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.hidden = true; }, 3200);
  }

  function route() {
    var h = (location.hash || '#login').slice(1).split('/');
    return { name: h[0] || 'login', arg: h[1], arg2: h[2] };
  }

  function render() {
    var r = route();
    var html, title = '', back = '', noteKey = r.name, tab = r.name;
    switch (r.name) {
      case 'home': html = viewHome(); break;
      case 'clients': html = viewClients(); break;
      case 'client': html = viewClient(+r.arg); title = 'Карточка клиента'; back = '#clients'; noteKey = 'client'; tab = 'clients'; break;
      case 'transfer':
        if (r.arg === 'done') { html = viewTransferDone(+r.arg2); title = 'Готово'; } else html = viewTransfer();
        break;
      case 'money': html = viewMoney(); break;
      case 'more': html = viewMore(); break;
      case 'docs': html = viewDocs(); title = 'Документы'; back = '#more'; tab = 'more'; break;
      case 'profile': html = viewProfile(); title = 'Профиль и реквизиты'; back = '#more'; tab = 'more'; break;
      case 'requisites':
        var R = S.req;
        if (r.arg === 'check') {
          if (!R.draft) { location.hash = '#requisites'; return; }
          html = viewRequisitesCheck(); title = 'Проверка реквизитов';
        } else {
          var mode = r.arg === 'change' ? 'change' : 'first';
          if (mode === 'change' && R.status !== 'saved') { location.hash = '#requisites'; return; }
          if (mode !== R.mode) { R.mode = mode; R.draft = null; }
          // первый ввод показываем за нового партнёра: прежние реквизиты в прототипе сбрасываются
          if (mode === 'first' && R.status === 'saved') { R.status = 'empty'; R.data = null; R.request = null; R.draft = null; }
          html = viewRequisites(); title = 'Реквизиты';
        }
        back = '#profile'; tab = 'more'; noteKey = R.mode === 'change' ? 'profile' : 'requisites';
        break;
      default: r.name = 'login'; noteKey = 'login'; html = viewLogin();
    }

    var isLogin = r.name === 'login';
    elApp.classList.toggle('no-side', isLogin);
    elTab.hidden = isLogin;
    if (isLogin) {
      elHead.innerHTML = '<span class="brand">' + I.logo + 'Кабинет партнёра</span>';
    } else if (back) {
      elHead.innerHTML = '<a class="icon-btn" href="' + back + '" aria-label="Назад">' + I.back + '</a><span class="head-title">' + title + '</span><span class="updated">обновлено ' + UPDATED + '</span>';
    } else {
      elHead.innerHTML = '<span class="brand">' + I.logo + 'Кабинет партнёра</span><span class="updated">обновлено ' + UPDATED + '</span>';
    }
    var tabs = [['home', 'Главная', I.home], ['clients', 'Клиенты', I.clients], ['transfer', 'Передать клиента', I.plus], ['money', 'Вознаграждение', I.money], ['more', 'Ещё', I.more]];
    var shortLabel = { transfer: 'Передать', money: 'Деньги' };
    elTab.innerHTML = tabs.map(function (t) {
      var cur = tab === t[0] ? ' aria-current="page"' : '';
      var label = '<span class="lbl-short only-narrow">' + (shortLabel[t[0]] || t[1]) + '</span><span class="only-wide">' + t[1] + '</span>';
      if (t[0] === 'transfer') return '<a class="plus" href="#transfer"' + cur + '><span class="circle">' + t[2] + '</span>' + label + '</a>';
      return '<a href="#' + t[0] + '"' + cur + '>' + t[2] + label + '</a>';
    }).join('');

    elView.innerHTML = html;
    elView.scrollTop = 0;
    if (narrowMQ.matches) window.scrollTo(0, 0);
    bindView(r);
    renderNotes(noteKey, r);
  }

  function renderNotes(key, r) {
    var titles = { login: 'Вход', home: 'Главная', clients: 'Мои клиенты', client: 'Карточка клиента', transfer: 'Передать клиента', money: 'Вознаграждение', more: 'Ещё',
      docs: 'Документы', profile: 'Профиль и реквизиты', requisites: 'Реквизиты: первый ввод' };
    document.getElementById('noteTitle').textContent = 'Экран: ' + titles[key];
    document.getElementById('noteBox').innerHTML = '<ul>' + NOTES[key].map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' +
      '<span class="note-tag">Все экраны прототипа</span>';
    document.getElementById('screenList').innerHTML = SCREENS.map(function (s) {
      var isCur = s[0] === key || (s[0] === 'client/1' && key === 'client');
      return '<a href="#' + s[0] + '"' + (isCur ? ' aria-current="page"' : '') + '><span>' + s[1] + '</span><span>п. ' + s[2] + '</span></a>';
    }).join('');
  }

  /* ===================== Режим «Телефон / Компьютер» ===================== */
  function setMode(mode, save) {
    if (narrowMQ.matches) mode = 'phone';
    elStage.setAttribute('data-mode', mode);
    document.querySelectorAll('.mode button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === mode)); });
    if (save) { try { localStorage.setItem('zk-proto-mode', mode); } catch (e) { /* хранилище недоступно — не страшно */ } }
  }
  document.querySelector('.mode').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (b) setMode(b.getAttribute('data-mode'), true);
  });
  var savedMode = 'phone';
  try { savedMode = localStorage.getItem('zk-proto-mode') || 'phone'; } catch (e) { savedMode = 'phone'; }
  setMode(savedMode, false);

  /* ===================== Тема «Светлая / Тёмная» ===================== */
  function setTheme(t, save) {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('.theme-sw button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === t)); });
    if (save) { try { localStorage.setItem('zk-proto-theme', t); } catch (e) { /* хранилище недоступно — не страшно */ } }
  }
  document.querySelector('.theme-sw').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-theme-set]');
    if (b) setTheme(b.getAttribute('data-theme-set'), true);
  });
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

  /* ===================== Поведение экранов ===================== */
  function bindView(r) {
    if (r.name === 'login') bindLogin();
    if (r.name === 'clients') bindClients();
    if (r.name === 'transfer' && r.arg !== 'done') bindTransfer();
    if (r.name === 'requisites') bindRequisites();
  }

  var resendTimer = null;
  function bindLogin() {
    clearInterval(resendTimer);
    var af = document.getElementById('acceptForm');
    if (af) {
      af.addEventListener('submit', function (e) {
        e.preventDefault();
        var ok = document.getElementById('acTerms').checked && document.getElementById('acConsent').checked;
        document.getElementById('acceptErr').hidden = ok;
        if (!ok) return;
        S.accepted = true; S.login.step = 'email';
        location.hash = '#home';
      });
      return;
    }
    var f = document.getElementById('loginForm');
    if (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var v = document.getElementById('loginEmail').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { document.getElementById('loginErr').hidden = false; document.getElementById('loginEmail').classList.add('invalid'); return; }
        S.login.email = v; S.login.step = 'code'; render();
      });
      return;
    }
    var cf = document.getElementById('codeForm');
    var code = document.getElementById('loginCode');
    code.focus();
    code.addEventListener('input', function () { code.value = digits(code.value).slice(0, 6); });
    cf.addEventListener('submit', function (e) {
      e.preventDefault();
      if (digits(code.value).length !== 6) { document.getElementById('codeErr').hidden = false; code.classList.add('invalid'); return; }
      if (!S.accepted) { S.login.step = 'accept'; render(); return; }
      S.login.step = 'email';
      location.hash = '#home';
    });
    var left = 59, rs = document.getElementById('resend');
    resendTimer = setInterval(function () {
      left--;
      if (!document.body.contains(rs)) { clearInterval(resendTimer); return; }
      if (left <= 0) {
        clearInterval(resendTimer);
        rs.innerHTML = '<button class="link-btn" type="button" data-toast="Новый код отправлен. Прежний больше не действует.">Отправить код ещё раз</button>';
      } else rs.textContent = 'Отправить ещё раз через 0:' + pad(left);
    }, 1000);
  }

  function refreshList() { document.getElementById('clientList').innerHTML = clientListHTML(); }
  function bindClients() {
    var q = document.getElementById('q');
    q.addEventListener('input', function () { S.search = q.value; refreshList(); });
    document.getElementById('period').addEventListener('change', function (e) { S.period = e.target.value; refreshList(); });
    document.getElementById('village').addEventListener('change', function (e) { S.village = e.target.value; refreshList(); });
  }

  function readReq() {
    var d = S.req.draft;
    d.form = document.getElementById('rq-form').value;
    reqFields(d.form).forEach(function (fl) {
      var el = document.getElementById('rq-' + fl[0]);
      if (el) d[fl[0]] = fl[0] === 'name' ? el.value : digits(el.value);
    });
  }
  function bindRequisites() {
    var R = S.req;
    var cf = document.getElementById('reqCheck');
    if (cf) {
      cf.addEventListener('submit', function (e) {
        e.preventDefault();
        var ok = document.getElementById('rqOk').checked;
        document.getElementById('rqOkErr').hidden = ok;
        if (!ok) return;
        if (R.mode === 'change') {
          R.request = TODAY;
          toast('Заявка отправлена менеджеру по партнёрам.');
        } else {
          R.data = R.draft; R.status = 'saved';
          toast('Реквизиты сохранены. На e-mail отправлено письмо-подтверждение.');
        }
        R.draft = null;
        location.hash = '#profile';
      });
      return;
    }
    var f = document.getElementById('reqForm');
    document.getElementById('rq-form').addEventListener('change', function () { readReq(); render(); });
    var bik = document.getElementById('rq-bik');
    bik.addEventListener('input', function () { document.getElementById('bankName').textContent = BANKS[digits(bik.value)] || 'Банк определится по БИК'; });
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      readReq();
      var errs = reqErrors(R.draft), firstBad = null;
      reqFields(R.draft.form).forEach(function (fl) {
        var el = document.getElementById('rq-' + fl[0]), er = document.getElementById('re-' + fl[0]);
        er.hidden = !errs[fl[0]];
        er.textContent = errs[fl[0]] || '';
        el.classList.toggle('invalid', !!errs[fl[0]]);
        if (errs[fl[0]] && !firstBad) firstBad = el;
      });
      if (firstBad) { firstBad.focus(); return; }
      location.hash = '#requisites/check';
    });
  }

  function bindTransfer() {
    var f = document.getElementById('tf');
    var phone = document.getElementById('tfPhone');
    var email = document.getElementById('tfEmail');
    function method() { return f.querySelector('input[name="method"]:checked').value; }
    function sync() {
      var m = method();
      document.getElementById('plotReq').hidden = m !== 'deal';
      document.getElementById('pickFields').hidden = m !== 'pick';
    }
    function isDup() {
      var d = digits(phone.value);
      var e = email.value.trim().toLowerCase();
      /* «уже в базе» — только демо-номера на …00; свой клиент партнёра — не «из базы» (ответ кабинета — к разбору прототипа) */
      return d.length === 11 && d.slice(-2) === '00';
    }
    function checkDup() { document.getElementById('dup').hidden = !isDup(); }
    f.addEventListener('change', function (e) { if (e.target.name === 'method') sync(); });
    phone.addEventListener('input', function () {
      var d = digits(phone.value);
      if (d[0] === '8') d = '7' + d.slice(1);
      if (d && d[0] !== '7') d = '7' + d;
      d = d.slice(0, 11);
      var out = d ? '+7' : '';
      if (d.length > 1) out += ' ' + d.slice(1, 4);
      if (d.length > 4) out += ' ' + d.slice(4, 7);
      if (d.length > 7) out += '-' + d.slice(7, 9);
      if (d.length > 9) out += '-' + d.slice(9, 11);
      phone.value = out;
      checkDup();
    });
    email.addEventListener('change', checkDup);
    sync();

    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var firstBad = null;
      function need(cond, inputId, errId) {
        var inp = document.getElementById(inputId);
        document.getElementById(errId).hidden = cond;
        inp.classList.toggle('invalid', !cond);
        if (!cond && !firstBad) firstBad = inp;
      }
      var name = document.getElementById('tfName').value.trim();
      var m = method();
      var plot = document.getElementById('tfPlot').value.trim();
      need(!!name, 'tfName', 'eName');
      need(digits(phone.value).length === 11, 'tfPhone', 'ePhone');
      need(m !== 'deal' || !!plot, 'tfPlot', 'ePlot');
      need(document.getElementById('tfConsent').checked, 'tfConsent', 'eConsent');
      if (firstBad) { firstBad.focus(); return; }
      var village = document.getElementById('tfVillage').value;
      var vil = VILLAGES.filter(function (v) { return v.name === village; })[0];
      var dir = vil ? vil.dir : '';
      var dup = isDup();
      var id = clients.reduce(function (mx, c) { return Math.max(mx, c.id); }, 0) + 1;
      clients.unshift({
        id: id, name: name, phone: phone.value, email: email.value.trim(), dir: dir, method: m,
        village: village || 'посёлок не выбран', plot: plot, budget: document.getElementById('tfBudget').value.trim(),
        areaWish: document.getElementById('tfArea').value.trim(), passed: TODAY, changed: TODAY, stage: m === 'self' ? 2 : 1,
        manager: m === 'self' ? '' : 'будет назначен', rate: dup ? RATES.base : RATES[m], fixedUntil: addMonths(TODAY, 6), dup: dup,
        path: m === 'self' ? [[1, TODAY], [2, TODAY]] : [[1, TODAY]],
        history: [[TODAY, dup ? 'Вы передали клиента; он уже был в базе компании' : 'Вы передали клиента']]
      });
      location.hash = '#transfer/done/' + id;
    });
  }

  /* Делегирование кликов внутри кабинета */
  elApp.addEventListener('click', function (e) {
    var t = e.target.closest('[data-toast],[data-action],[data-filter],[data-tab],tr[data-href]');
    if (!t) return;
    if (t.hasAttribute('data-toast')) { toast(t.getAttribute('data-toast')); return; }
    if (t.matches('tr[data-href]')) { if (!e.target.closest('a')) location.hash = t.getAttribute('data-href'); return; }
    if (t.hasAttribute('data-filter')) {
      S.filter = t.getAttribute('data-filter');
      document.querySelectorAll('.chip').forEach(function (ch) { ch.setAttribute('aria-pressed', String(ch === t)); });
      refreshList();
      return;
    }
    if (t.hasAttribute('data-tab')) { S.moneyTab = t.getAttribute('data-tab'); render(); return; }
    var a = t.getAttribute('data-action');
    if (a === 'excel') toast('Файл «Мои клиенты.xlsx» сформирован: клиенты по текущим фильтрам, телефоны полностью. В прототипе файл не скачивается.');
    if (a === 'reset') { S.filter = 'all'; S.search = ''; S.period = 'all'; S.village = ''; render(); }
    if (a === 'login-back') { S.login.step = 'email'; render(); }
    if (a === 'logout') { S.login.step = 'email'; location.hash = '#login'; }
    if (a === 'req-sample') {
      readReq();
      var smp = REQ_SAMPLE[S.req.draft.form];
      Object.keys(smp).forEach(function (k) { S.req.draft[k] = smp[k]; });
      render();
    }
  });

  /* Пояснения: на узком экране свёрнуты */
  if (narrowMQ.matches) document.getElementById('about').open = false;

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
